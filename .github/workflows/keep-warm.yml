name: Keep warm

# Render's free plan sleeps after 15 minutes idle, and the next visitor waits about a minute.
# A ping every 10 minutes keeps it awake. One service running all month fits the free 750 hours.
# GitHub may delay scheduled runs a few minutes, and pauses them after 60 days without repo activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s --max-time 90 --retry 2 "${{ vars.APP_URL || 'https://cap2-hi8u.onrender.com' }}/healthz"
