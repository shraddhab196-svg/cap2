name: Keep warm

# Render's free plan sleeps after 15 minutes idle, and the next visitor (or AI fetcher) waits over two minutes,
# long enough for most fetchers to time out. One service running all month fits the free 750 hours.
# GitHub fires scheduled runs late and drops many (in practice every 3-7 hours, not every 10 minutes),
# so each run keeps pinging every 10 minutes for nearly the 6-hour job limit, and a newer run replaces it.
# GitHub pauses schedules after 60 days without repo activity.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 10 minutes for about 5h50m
        run: |
          for i in $(seq 1 35); do
            curl -s --max-time 90 --retry 2 "${{ vars.APP_URL || 'https://cap2-hi8u.onrender.com' }}/healthz" || echo "ping $i failed"
            echo
            sleep 600
          done
