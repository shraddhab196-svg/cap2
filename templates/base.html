<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cover letters in your own voice{% endblock %} · Cover Letter AI</title>
    <meta name="description" content="Cover Letter AI learns how you write from your past letters, researches the company, and drafts a cover letter that sounds like you on your best day." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
{% block head %}{% endblock %}
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231A1714'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-style='italic' font-size='38' text-anchor='middle' fill='%23F4EFE6'%3Ec%3C/text%3E%3Ccircle cx='47' cy='42' r='4' fill='%23D9432B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="{{ asset('css/base.css') }}?v=8" />
    {% block styles %}<link rel="stylesheet" href="{{ asset('css/app.css') }}?v=10" />{% endblock %}
    <link rel="expect" href="#main" blocking="render" />
    <script>
        document.documentElement.classList.add("js");
        try { var savedTheme = localStorage.getItem("theme"); if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme; } catch (e) {}
        // Moving to an earlier step (back button, or Profile from the menu) slides the page the other way.
        // Must be registered before the first render, so it lives here rather than in app.js.
        (function () {
            var step = function () { var main = document.querySelector("main[data-step-num]"); return main ? Number(main.dataset.stepNum) : 0; };
            addEventListener("pageswap", function () { try { sessionStorage.setItem("vt-step", step()); } catch (e) {} });
            addEventListener("pagereveal", function (event) {
                if (!event.viewTransition) return;
                var from = 0;
                try { from = Number(sessionStorage.getItem("vt-step")) || 0; } catch (e) {}
                if (from && step() && step() < from) event.viewTransition.types.add("back");
            });
        })();
    </script>
</head>
<body class="{% block body_class %}app{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>
{% block body %}
{% include "partials/account_header.html" %}
    <main id="main" class="page {% block page_class %}{% endblock %}"{% if journey_step is defined %} data-step-num="{{ '%02d' | format(journey_step) }}"{% endif %}>
{% block content %}{% endblock %}
    </main>
{% endblock %}
    <div class="ink-overlay" role="status" aria-live="polite">
        <div class="ink-overlay-inner">
            <svg class="ink-scribble" viewBox="0 0 320 80" aria-hidden="true"><path d="M6 52c18-30 30-34 36-20s-6 30 8 22 22-40 34-36-8 38 6 36 24-30 36-30 0 26 14 26 22-24 34-26 4 24 18 24 28-30 40-28-6 24 8 24 30-18 42-20 20 6 30 4" /></svg>
            <p class="ink-status" data-ink-status>Working on it…</p>
            <p class="ink-hint">This can take a moment · keep this tab open</p>
        </div>
    </div>
    <script src="{{ asset('js/app.js') }}?v=9" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
